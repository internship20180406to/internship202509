<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>ローン申込情報入力画面</title>
    <style>

        body {
            background-color: #f7f9fc;
            margin: 0;
            padding: 0;
            display: flex;
            padding-top: 40px;
            padding-bottom: 40px;
            justify-content: center;
            align-items: center;
            min-height: 85vh;
            font-family: "Helvetica Neue", sans-serif;
        }

        .content {
            background-color: #ffffff;
            width: 90%;
            max-width: 700px;
            padding: 30px 40px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
        }


        .stepper {
            display: flex;
            justify-content: space-between;
            margin-bottom: 30px;
        }

        .step {
            text-align: center;
            flex: 1;
            position: relative;
        }

        .step::before {
            content: '';
            position: absolute;
            top: 20px;
            left: -50%;
            width: 100%;
            height: 2px;
            background-color: #dcdcdc;
            z-index: 0;
        }

        .step:first-child::before {
            display: none;
        }

        .circle {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background-color: #dcdcdc;
            color: white;
            display: inline-block;
            line-height: 36px;
            font-weight: bold;
            position: relative;
            z-index: 1;
        }

        .step.active .circle {
            background-color: #3498db;
        }

        .step .label {
            margin-top: 6px;
            font-size: 14px;
            color: #555;
        }

        .step.active .label {
            font-weight: bold;
            color: #3498db;
        }


        h1 {
            font-size: 24px;
            text-align: center;
            margin-bottom: 25px;
            color: #333;
        }

        label {
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
            color: #333;
        }

        .form-control {
            width: 100%;
            padding: 10px 12px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }

        .form-control:focus {
            border-color: #3498db;
            outline: none;
            box-shadow: 0 0 3px rgba(52, 152, 219, 0.5);
        }

        .text-danger {
            color: red;
            font-size: 12px;
        }

        .form-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .form-control-button {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            min-width: 100px;
        }

        .form-confirmation-button {
            background-color: #3498db;
            color: white;
        }

        .form-confirmation-button:hover {
            background-color: #2c80b4;
        }

        .form-clear-button {
            background-color: #e0e1e2;
            color: #333;
        }

        .form-clear-button:hover {
            background-color: #cccccc;
        }

        @media (max-width: 600px) {
            .form-buttons {
                flex-direction: column;
                gap: 10px;
            }
        }
    </style>
</head>
<body>
<div class="content">

    <div class="stepper">
        <div class="step active">
            <div class="circle">1</div>
            <div class="label">入力</div>
        </div>
        <div class="step">
            <div class="circle">2</div>
            <div class="label">確認</div>
        </div>
        <div class="step">
            <div class="circle">3</div>
            <div class="label">完了</div>
        </div>
    </div>

    <h1>ローン申込情報入力</h1>
    <form action="#" th:action="@{/bankLoanConfirmation}" th:object="${bankLoanApplication}" method="post"
    onsubmit = "return checkForm()">
        <p><label class="ml-1">金融機関名: <small class="text-danger ml-1">※必須</small></label><br>
            <select th:field="*{bankName}" class="form-control" id = "bankName">
                <option value="">--選択してください--</option>
                <option th:each="option : ${nameOptions}"
                            th:value="${option}"
                            th:text="${option}">選択肢
                </option>
            </select></p>
        <p><label class="ml-1">支店名: <small class="text-danger ml-1">※必須</small></label><br>
            <input type="text" th:field="*{branchName}" class="form-control" id="branchName" placeholder="支店名を記入してください"/></p>
        <p><label class="ml-1">科目名: <small class="text-danger ml-1">※必須</small></label><br>
            <select th:field="*{subjectName}" class="form-control" id="subjectName">
                <option value="">--選択してください--</option>
                <option th:each="option : ${subjectOptions}"
                        th:value="${option}"
                        th:text="${option}">選択肢
                </option>
            </select></p>
        <p><label class="ml-1">口座番号: <small class="text-danger ml-1" >※必須</small></label><br>
            <input type="number" th:field="*{bankAccountNum}" class="form-control" id="bankAccountNum" placeholder="1234567"/></p>
        <p><label class="ml-1">債務者名: <small class="text-danger ml-1">※必須</small></label><br>
            <input type="text" th:field="*{debtorName}" class="form-control" id="debtorName" placeholder="債務者名を記入してください"/></p>

        <p><label class="ml-1">借入金額: <small class="text-danger ml-1">※必須</small></label><br>
            <input type="text" th:field="*{loanAmount}" class="form-control" id="loanAmount" placeholder="借入金額を記入してください"/></p>

        <p><label class="ml-1">借入年収: <small class="text-danger ml-1">※必須</small></label><br>
            <input type="text" th:field="*{borrowingIncome}" class="form-control" id="borrowingIncome" placeholder="借入年収を記入してください"/></p>

        <p><label class="ml-1">金利: <small class="text-danger ml-1">※必須</small></label><br>
            <input type="text" th:field="*{interestRate}" class="form-control" id="interestRate" placeholder="金利を記入してください"/></p>
        <p style="text-align: center;"><input type="submit" value="確認"
                                              class="form-control-button form-confirmation-button"/>
            <input type="reset" value="クリア" class="form-control-button form-clear-button"/></p>
    </form>

    <script>
        function checkForm(){
            var bankName = document.getElementById("bankName");
            var branchName = document.getElementById("branchName");
            var subjectName = document.getElementById("subjectName");
            var bankAccountNum = document.getElementById("bankAccountNum");
            var debtorName = document.getElementById("debtorName");
            var loanAmount = document.getElementById("loanAmount");
            var borrowingIncome = document.getElementById("borrowingIncome");
            var interestRate = document.getElementById("interestRate");

            var fields=[ bankName, branchName, subjectName, bankAccountNum, debtorName, loanAmount, borrowingIncome, interestRate ];

            for (var i = 0; i < fields.length; i++){
                if(fields[i] === ""){
                    alert("未入力の必須項目があります!");
                    fields[i].focus();
                    return false;
                }
            }
            return true;
        }



    </script>
</div>
</body>

</html>
