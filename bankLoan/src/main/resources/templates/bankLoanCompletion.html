<!doctype html>
<html>
<head>
    <meta charset="UTF-8"/>
    <title>申込完了画面</title>
    <style>
        body {
            background-color: #f7f9fc;
            margin: 0;
            padding: 40px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 90vh;
            font-family: "Helvetica Neue", sans-serif;
        }

        .content {
            background-color: #ffffff;
            width: 90%;
            max-width: 700px;
            padding: 30px 40px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        h1 {
            margin-bottom: 30px;
            font-size: 24px;
            color: #2c3e50;
        }

        /* === ステップバー === */
        .stepper {
            display: flex;
            justify-content: space-between;
            margin-bottom: 40px;
        }

        .step {
            text-align: center;
            flex: 1;
            position: relative;
        }

        .step::before {
            content: '';
            position: absolute;
            top: 20px;
            left: -50%;
            width: 100%;
            height: 2px;
            background-color: #dcdcdc;
            z-index: 0;
        }

        .step:first-child::before {
            display: none;
        }

        .circle {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background-color: #dcdcdc;
            color: white;
            display: inline-block;
            line-height: 36px;
            font-weight: bold;
            position: relative;
            z-index: 1;
        }

        .step.active .circle {
            background-color: #27ae60;
        }

        .label {
            margin-top: 6px;
            font-size: 14px;
            color: #555;
        }

        .step.active .label {
            font-weight: bold;
            color: #27ae60;
        }

        .form-control-button {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            min-width: 100px;
        }

        .form-confirmation-button {
            background-color: #3498db;
            color: white;
        }

        .form-confirmation-button:hover {
            background-color: #2c80b4;
        }

        .form-clear-button {
            background-color: #e0e1e2;
            color: #333;
        }

        .form-clear-button:hover {
            background-color: #cccccc;
        }

        @media (max-width: 600px) {
            .form-buttons {
                flex-direction: column;
                gap: 10px;
            }
        }
    </style>
</head>
<body>
<div class="content">

    <div class="stepper">
        <div class="step active">
            <div class="circle">1</div>
            <div class="label">入力</div>
        </div>
        <div class="step active">
            <div class="circle">2</div>
            <div class="label">確認</div>
        </div>
        <div class="step active">
            <div class="circle">3</div>
            <div class="label">完了</div>
        </div>
    </div>

<h1>申込完了</h1>
<p class="form-buttons"><input type="button" value="申込に戻る" class="form-control-button form-clear-button" onclick="window.location='/bankLoan';"/></p>
</body>

</html>
