<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
    <meta charset="UTF-8"/>
    <title>申込完了画面</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
        :root{
          --bg: #f6f8fb;
          --card: #ffffff;
          --text: #222;
          --muted: #6b7280;
          --primary: #2563eb;
          --primary-hover: #1d4ed8;
          --ring: rgba(37,99,235,.25);
          --danger: #dc2626;
          --radius: 14px;
          --shadow: 0 10px 30px rgba(2,8,23,.08);

          /* stepper */
          --accent: #0f5132;
          --accent-weak: #e8f1ed;
        }

        *{ box-sizing:border-box }
        html,body{ height:100% }
        body{
          margin:0;
          font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "ヒラギノ角ゴ ProN", "Hiragino Kaku Gothic ProN", "游ゴシック体", "Yu Gothic", "メイリオ", Meiryo, sans-serif;
          color:var(--text);
          background:
            radial-gradient(60rem 60rem at 10% 10%, #eef2ff 0%, transparent 60%),
            radial-gradient(80rem 80rem at 90% 10%, #e0f2fe 0%, transparent 60%),
            var(--bg);
          display:flex; justify-content:center; align-items:flex-start;
          padding:40px 20px;
        }

        .container{ width:min(720px, 100%); padding:16px; }
        .card{
          background:var(--card);
          border-radius:var(--radius);
          box-shadow:var(--shadow);
          overflow:hidden;
          border:1px solid #eef2f7;
        }
        .card-header{
          padding:22px 24px;
          border-bottom:1px solid #eef2f7;
          background:linear-gradient(180deg,#ffffff, #f9fafb);
        }
        .title{
          margin:0;
          font-size: clamp(20px, 2.2vw, 26px);
          font-weight:600;
          letter-spacing:.02em;
        }
        .subtitle{ margin:.35rem 0 0; color:var(--muted); font-size:14px; }

        /* Stepper (3段階) */
        .stepper{ position:relative; padding:10px 16px 6px; }
        .stepper .track{
          position:absolute; left:28px; right:28px; top:24px;
          height:4px; border-radius:999px; background:var(--accent-weak);
        }
        .stepper .fill{
          position:absolute; left:28px; top:24px; height:4px; border-radius:999px; background:var(--accent);
          width:calc((var(--step,3) - 1) * 50%); transition:width .25s ease;
        }
        .stepper .steps{ display:grid; grid-template-columns:repeat(3,1fr); align-items:start; gap:0; }
        .stepper .step{ text-align:center; position:relative; }
        .stepper .dot{
          width:14px; height:14px; border-radius:999px; background:#e5e7eb;
          display:inline-block; margin:16px auto 6px; box-shadow:0 0 0 3px #fff inset;
        }
        .stepper .label{ font-size:12px; color:var(--muted); }
        .stepper .step.is-current .dot,
        .stepper .step.is-complete .dot{ background:var(--accent); }
        .stepper .step.is-current .label,
        .stepper .step.is-complete .label{ color:var(--text); font-weight:600; }

        /* 完了アイコン＆メッセージ */
        .success{
          padding:28px 24px 8px;
          display:flex; flex-direction:column; align-items:center; text-align:center; gap:12px;
        }
        .badge{
          width:64px; height:64px; border-radius:999px; background:#e8f6ef;
          display:grid; place-items:center; box-shadow:inset 0 0 0 8px #f3fbf7;
        }
        .badge svg{ width:30px; height:30px; color:#16a34a; }
        .lead{ font-size: clamp(18px, 2vw, 20px); font-weight:700; margin:0; }
        .note{ color:var(--muted); font-size:14px; margin:0; }

        .detail{
          margin: 8px 24px 0;
          padding:14px 16px;
          background:#f9fafb;
          border:1px dashed #e5e7eb;
          border-radius:12px;
          color:var(--muted);
          font-size:13px;
        }

        .actions{
          display:flex; justify-content:center; gap:12px;
          padding: 18px 24px 24px;
        }
        .btn{
          border:0; border-radius:999px; cursor:pointer;
          padding:12px 20px; font-weight:600; font-size:14px; min-width:160px;
          transition: transform .02s ease, box-shadow .15s ease, background .15s ease;
        }
        .btn:active{ transform: translateY(0.5px); }
        .btn-primary{ background:var(--primary); color:#fff; box-shadow:0 6px 18px rgba(37,99,235,.25); }
        .btn-primary:hover{ background:var(--primary-hover); }
        .btn-ghost{ background:#f3f4f6; color:#111827; }
        .btn-ghost:hover{ background:#e5e7eb; }
    </style>
</head>

<body>
<main class="container">
    <section class="card" role="region" aria-labelledby="page-title">
        <header class="card-header">
            <h1 class="title" id="page-title">申込完了</h1>

            <!-- ステッパー（3/3 完了）。currentStep が無い場合でも完了表示に -->
            <div class="stepper"
                 th:with="step=${currentStep} ?: 3"
                 th:style="'--step:' + ${step} + ';'">
                <div class="track"></div>
                <div class="fill"></div>
                <ol class="steps" role="list" aria-label="申込ステップ">
                    <li class="step is-complete">
                        <span class="dot" aria-hidden="true"></span>
                        <span class="label">ローン申し込み</span>
                    </li>
                    <li class="step is-complete">
                        <span class="dot" aria-hidden="true"></span>
                        <span class="label">申し込み確認</span>
                    </li>
                    <li class="step is-current">
                        <span class="dot" aria-hidden="true"></span>
                        <span class="label">申し込み完了</span>
                    </li>
                </ol>
            </div>
        </header>

        <div class="success" role="status" aria-live="polite">
        <span class="badge" aria-hidden="true">
          <!-- チェックアイコン（SVG） -->
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20 6L9 17l-5-5"></path>
          </svg>
        </span>
            <p class="lead">お申し込みが完了しました</p>
        </div>


    </section>
</main>
</body>
</html>
