<!doctype html>
<html>
<head>
    <meta charset="UTF-8"/>
    <title>申込完了画面</title>
    <style>
        body {
            background-color: #e9f5ee;
            margin: 0;
            padding: 40px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 90vh;
            font-family: "Helvetica Neue", sans-serif;
        }

        .content {
            background-color: #ffffff;
            width: 90%;
            max-width: 700px;
            padding: 30px 40px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        h1 {
            margin-bottom: 30px;
            font-size: 24px;
            color: #2c3e50;
        }

        /* === ステップバー === */
        .stepper {
            display: flex;
            justify-content: space-between;
            margin-bottom: 40px;
        }

        .step {
            text-align: center;
            flex: 1;
            position: relative;
        }

        .step::before {
            content: '';
            position: absolute;
            top: 20px;
            left: -50%;
            width: 100%;
            height: 2px;
            background-color: #cde4d3;
            z-index: 0;
        }

        .step:first-child::before {
            display: none;
        }

        .circle {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background-color: #b6d9c7;
            color: white;
            display: inline-block;
            line-height: 36px;
            font-weight: bold;
            position: relative;
            z-index: 1;
        }

        .step.active .circle {
            background-color: #27ae60;
        }

        .label {
            margin-top: 6px;
            font-size: 14px;
            color: #555;
        }

        .step.active .label {
            font-weight: bold;
            color: #27ae60;
        }

        .form-control-button {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            min-width: 100px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);

        }

        .form-confirmation-button {
            background: linear-gradient(to right, #6dc8a4, #27ae60);
            color: white;
        }

        .form-confirmation-button:hover {
            background: linear-gradient(to right, #5dbb97, #229954);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.1);

        }

        .form-clear-button {
            background: linear-gradient(to right, #d7f0e1, #c2e4d0);
            color: #2c3e50;

        }

        .form-clear-button:hover {
            background: linear-gradient(to right, #c2e4d0, #b0d9c3);
            color: #1a1a1a;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.1);

        }

        @media (max-width: 600px) {
            .form-buttons {
                flex-direction: column;
                gap: 10px;
            }
        }
    </style>
</head>
<body>
<div class="content">

    <div class="stepper">
        <div class="step active">
            <div class="circle">1</div>
            <div class="label">入力</div>
        </div>
        <div class="step active">
            <div class="circle">2</div>
            <div class="label">確認</div>
        </div>
        <div class="step active">
            <div class="circle">3</div>
            <div class="label">完了</div>
        </div>
    </div>

<h1>申込完了</h1>
<p class="form-buttons"><input type="button" value="申込に戻る" class="form-control-button form-clear-button" onclick="window.location='/bankLoan';"/></p>
</body>

</html>
