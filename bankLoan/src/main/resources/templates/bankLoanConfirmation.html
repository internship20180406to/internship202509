<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ローン申込確認画面</title>

    <style>
        body {
            background-color: #e9f5ee;
            margin: 0;
            padding: 40px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 90vh;
            font-family: "Helvetica Neue", sans-serif;
        }

        .content {
            background-color: #ffffff;
            width: 90%;
            max-width: 700px;
            padding: 30px 40px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            font-size: 24px;
            color: #2c3e50;
        }

        p {
            margin-bottom: 15px;
            font-size: 15px;
            color: #444;
        }

        /* === ステップバー === */
        .stepper {
            display: flex;
            justify-content: space-between;
            margin-bottom: 30px;
        }

        .step {
            text-align: center;
            flex: 1;
            position: relative;
        }

        .step::before {
            content: '';
            position: absolute;
            top: 20px;
            left: -50%;
            width: 100%;
            height: 2px;
            background-color: #cde4d3;
            z-index: 0;
        }

        .step:first-child::before {
            display: none;
        }

        .circle {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background-color: #b6d9c7;
            color: white;
            display: inline-block;
            line-height: 36px;
            font-weight: bold;
            position: relative;
            z-index: 1;
        }

        .step.active .circle {
            background-color: #48a885;
        }

        .step .label {
            margin-top: 6px;
            font-size: 14px;
            color: #555;
        }

        .step.active .label {
            font-weight: bold;
            color: #48a885;
        }

        .form-control-button {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            min-width: 100px;
            transition: all 0.3s ease;
        }

        .form-confirmation-button {
            background: linear-gradient(to right, #6dc8a4, #48a885);
            color: white;
            box-shadow: 0.4px 10px rgba(0, 0, 0, 0.1);
        }

        .form-confirmation-button:hover {
            background: linear-gradient(to right, #6dc8a4, #48a885);
            color: white;
            box-shadow: 0.6px 12px rgba(0, 0, 0, 0.2);
        }

        .form-clear-button {
            background: linear-gradient(to right, #d7f0e1, #c2e4d0);
            color: #2c3e50;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);

        }

        .form-clear-button:hover {
            background: linear-gradient(to right, #c2e4d0, #b0d9c3);
            color: #1a1a1a;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);

        }

        @media (max-width: 600px) {
            .form-buttons {
                flex-direction: column;
                gap: 10px;
            }
        }
    </style>
</head>
<body>
<div class="content">

    <!-- ステップバー（確認画面なので Step2 が active） -->
    <div class="stepper">
        <div class="step active">
            <div class="circle">1</div>
            <div class="label">入力</div>
        </div>
        <div class="step active">
            <div class="circle">2</div>
            <div class="label">確認</div>
        </div>
        <div class="step">
            <div class="circle">3</div>
            <div class="label">完了</div>
        </div>
    </div>
</head>
<body>


<h1>ローン申込確認画面</h1>
<form action="#" th:action="@{/bankLoanCompletion}" th:object="${bankLoanApplication}" method="post">
    <p>金融機関名: <span th:text="*{bankName}"></span></p>
    <p>支店名: <span th:text="*{branchName}"></span></p>
    <p>科目名: <span th:text="*{subjectName}"></span></p>
    <p>口座番号: <span th:text="*{bankAccountNum}"></span></p>
    <p>債務者名: <span th:text="*{debtorName}"></span></p>
    <p>ローンの種類: <span th:text="*{loanType}"></span></p>
    <p>借入金額: <span th:text="*{loanAmount}"></span>円</p>
    <p>借入年収: <span th:text="*{borrowingIncome}"></span></p>
    <p>借入年数: <span th:text="*{loanTerm}"></span></p>
    <p>金利: <span th:text="*{interestRate}"></span></p>
    <input type="hidden" name="bankAccountNum" th:value="*{bankAccountNum}"/>
    <input type="hidden" name="branchName" th:value="*{branchName}"/>
    <input type="hidden" name="subjectName" th:value="*{subjectName}"/>
    <input type="hidden" name="bankName" th:value="*{bankName}"/>
    <input type="hidden" name="debtorName" th:value="*{debtorName}"/>
    <input type="hidden" name="loanType" th:value="*{loanType}"/>
    <input type="hidden" name="loanAmount" th:value="*{loanAmount}"/>
    <input type="hidden" name="borrowingIncome" th:value="*{borrowingIncome}"/>
    <input type="hidden" name="loanTerm" th:value="*{loanTerm}"/>
    <input type="hidden" name="interestRate" th:value="*{interestRate}"/>
    <p class="form-buttons">
        <input type="submit" id="submit" value="申込" class="form-control-button form-confirmation-button"/>
        <input type="button" value="キャンセル" class="form-control-button form-clear-button" id="go-back" onclick="window.location='/bankLoan';"/>
    </p>

    <script>
        document.getElementById("go-back").addEventListener("click", () => {
                history.back();
        });
    </script>

</form>
<script th:inline="javascript" src="/js/bankLoanConfirmation.js"></script>
</body>
</html>
