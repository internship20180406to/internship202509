<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8"/>
    <title>投資信託注文情報入力画面</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat&display=swap" rel="stylesheet">

    <style>
        html {
          height:100%;
        }

        .bg {
          animation:slide 3s ease-in-out infinite alternate;
          background-image: linear-gradient(-60deg, #dfe6e9 50%, #74b9ff 50%);
          bottom:0;
          left:-50%;
          opacity:.5;
          position:fixed;
          right:-50%;
          top:0;
          z-index:-1;
        }

        .bg2 {
          animation-direction:alternate-reverse;
          animation-duration:4s;
        }

        .bg3 {
          animation-duration:5s;
        }

        .content {
          background-color:rgba(255,255,255,.8);
          border-radius:.25em;
          box-shadow:0 0 .25em rgba(0,0,0,.25);
          box-sizing:border-box;
          left:50%;
          padding:10vmin;
          position:fixed;
          top:50%;
          transform:translate(-50%, -50%);
        }

        @keyframes slide {
          0% {
            transform:translateX(-25%);
          }
          100% {
            transform:translateX(25%);
          }
        }

        body {
        background-color: #4169E1;
        margin: 0;
        padding: 0;
        display: flex;
        padding-top: 40px;
        padding-bottom: 40px;
        justify-content: center;
        align-items: center;
        min-height: 85vh;
        overflow: auto;
        }
        .content {
         font-size: 22px;
         background-color: rgba(255, 255, 255, 0.3);
         backdrop-filter: blur(10px);
         width: 50%;
         padding: 40px;
         padding-top: 0px;
         padding-bottom: 0px;
         border-radius: 10px;
         box-shadow: 0 4px 8px rgba(0,0,0,0.1);
         height: 93%;
         overflow: auto;

        }
        .form-control {
            width: 100%;
            max-width: 500px;
            padding: 8px;
            margin: 5px 0;
            box-sizing: border-box;
            font-size: 20px;
            background-color: rgba(255, 255, 255, 0.1); /* ほんのり白っぽい透明感 */
            backdrop-filter: blur(4px);                /* 背景をぼかしてガラス風に */
            border: 1px solid rgba(255, 255, 255, 0.3); /* 枠線も半透明に */
            color: #000000;
        }
        .text-danger {
        color: blue;
        }
        .form-control-button {
        width: 120px;
        padding: 10px 20px;
        margin-top: 10px;
        border: none;
        cursor: pointer;
        border-radius: 5px;

        }
        .form-confirmation-button{
        color: #fdf6e3;
        background-color: #1678c2;
        }
        .form-confirmation-button:hover {
        background-color: #2a5298
        }
        .form-clear-button{
        color: black;
        background-color: #EBEBEB;
        }
        .form-clear-button:hover {
        background-color: #CCCCCC;
        }

        h1 {
            font-size: 33px;
            position: relative;
            padding: 0.1em 0.5em;
            text-align: center;
            background: -webkit-linear-gradient(to top, #1e3c72, #2a5298);
            background: linear-gradient(to top, #1e3c72, #2a5298);
            color: 	#fdf6e3;
            margin-bottom: 0;
        }

        .form-row {
          font-size: 20px;
          max-width: 600px;
          width: 100%;
          display: flex;
          align-items: center;
          margin: 0 auto;
          margin-bottom: 14px;
          flex-direction: row;
        }

        .form-row label {
          min-width: 200px; /* ラベルの幅を固定 */
          white-space: nowrap;
          margin-right: 10px;
        }

        .form-row select {
          flex: 1; /* セレクトボックスを残りの幅に広げる */
        }

        h2 {
          position: relative;
          padding: 0.25em 0;
          font-size: 25px;
          margin-top: 0px;


        }
        h2:after {
          content: "";
          display: block;
          height: 5px;
          background: -webkit-linear-gradient(to right, ##1e3c72, #1e3c72);
          background: linear-gradient(to right, #1e3c72, #1e3c72);

        }

        .h3-row {
          display: flex;
          justify-content: center; /* 横方向の中央揃え */
          gap: 20px;               /* 要素間のスペース */
          margin-top: 0px;
          margin-bottom: 0;
        }

        .h3-row h3 {
          font-size: 18px;
          text-align: center;
          padding: 0.1em 0.5em;
          border-radius: 8px;
          flex: 1; /* 均等に広げたい場合は追加 */
        }

        .item-blue {
          background: linear-gradient(to top, #1e3c72, #2a5298);
          color: #fdf6e3;
        }

        .item-gray {
          background: linear-gradient(to right, #f5f5f5, #dcdcdc);
          color: #333333; /* 濃いグレーで視認性アップ */
        }

        .button-wrapper {
          display: flex;
          justify-content: center; /* 横方向の中央揃え */
          gap: 20px;               /* ボタン間のスペース */
          margin-top: 30px;
        }
        .warning {
          color: red;
          font-size: 14px;
          margin-left: 10px;
        }







    </style>
</head>
<body>

<div class="bg"></div>
<div class="bg bg2"></div>
<div class="bg bg3"></div>

<div class="content">
    <h1>投資信託</h1>
    <div class="h3-row">
        <h3 class="item-blue">注文入力</h3>
        <h3 class="item-gray">注文確認</h3>
        <h3 class="item-gray">注文完了</h3>
    </div>

    <form action="#" th:action="@{/investmentTrustConfirmation}" th:object="${investmentTrustApplication}" method="post">
        <h2>口座情報</h2>
        <div class="form-row">
            <label class="ml-1">金融機関名: <small class="text-danger ml-1">※</small><span id="bankWarning" class="warning" style="display:none;">必須</span></label><br>
            <select th:field="*{bankName}" class="form-control" id="bankSelect">
                <option value="">-- 選択してください --</option>
                <option th:each="option : ${nameOptions}"
                        th:value="${option}"
                        th:text="${option}">選択肢</option>
            </select>
        </div>



        <div class="form-row">
            <label class="ml-1">支店名: <small class="text-danger ml-1">※</small><span id="branchWarning" class="warning" style="display:none;">必須</span></label><br>
            <select th:field="*{branchName}" class="form-control" id="branchSelect">
                <option value="">-- 銀行を選択してください --</option>
            </select>
        </div>



        <div class="form-row">
            <label class="ml-1">科目名: <small class="text-danger ml-1">※</small><span id="typeWarning" class="warning" style="display:none;">必須</span></label><br>
            <select th:field="*{bankAccountType}" class="form-control">
                <option value="">-- 選択してください --</option>
                <option value="普通">普通</option>
                <option value="当座">当座</option>
                <option value="貯蓄">貯蓄</option>
            </select>
        </div>




        <div class="form-row">
            <label class="ml-1">口座番号: <small class="text-danger ml-1">※</small><span id="accountWarning" class="warning" style="display:none;">必須(7桁)</span></label><br>
            <input type="number" th:field="*{bankAccountNum}" class="form-control" placeholder="例)1234567"/></p>
        </div>


        <div class="form-row">
            <label class="ml-1">購入者名: <small class="text-danger ml-1">※</small><span id="nameWarning" class="warning" style="display:none;">必須</span></label><br>
            <input type="text" th:field="*{name}" class="form-control" placeholder="例)ふくのすけ"/></p>
        </div>
        <h2>購入情報</h2>
        <div class="form-row">
            <label class="ml-1">銘柄: <small class="text-danger ml-1">※</small><span id="fundWarning" class="warning" style="display:none;">必須</span></label><br>
            <select th:field="*{fundName}" class="form-control">
                <option value="">-- 選択してください --</option>
                <option value="鯨・グローバル・インデックス">鯨・グローバル・インデックス</option>
                <option value="イカロジック・テックセレクト">イカロジック・テックセレクト</option>
                <option value="亀・ロングライフ・バランス">亀・ロングライフ・バランス</option>
                <option value="フクロウ・インサイト・ファンド">フクロウ・インサイト・ファンド</option>
                <option value="熊・ディフェンシブ・バリュー">熊・ディフェンシブ・バリュー</option>
                <option value="モグラ・アンダーグラウンド・ストラテジー">モグラ・アンダーグラウンド・ストラテジー</option>

            </select>
        </div>

        <div class="form-row">
            <label class="ml-1">購入方法: <small class="text-danger ml-1">※</small><span id="methodWarning" class="warning" style="display:none;">必須</span></label><br>
            <select th:field="*{methodName}" class="form-control">
                <option value="">-- 選択してください --</option>
                <option value="金額指定">金額指定</option>
                <option value="口数指定">口数指定</option>

            </select>
        </div>


        <div class="form-row" id="moneyRow" style="display:none;">
            <label class="ml-1" >購入金額: <small class="text-danger ml-1">※</small><span id="moneyWarning" class="warning" style="display:none;">必須</span></label>
            <input type="number" th:field="*{money}" id="money" class="form-control" placeholder="例)10000"/>

        </div>



        <div class="form-row" id="unitRow" style="display:none;">
            <label class="ml-1" for="unit">
                購入口数: <small class="text-danger ml-1">※</small><span id="unitWarning" class="warning" style="display:none;">必須</span>
            </label>
            <input type="number" th:field="*{unit}" id="unit" class="form-control" placeholder="例)5000"/>

        </div>




        <p style="text-align: center;"><input type="submit" value="確認"
                                              class="form-control-button form-confirmation-button"/>
            <input type="reset" value="クリア" class="form-control-button form-clear-button"/></p>

    </form>
</div>


<script>
    document.addEventListener("DOMContentLoaded", function () {
      const bankSelect = document.getElementById("bankSelect");
      const branchSelect = document.getElementById("branchSelect");
      const form = document.querySelector("form");
      const methodSelect = document.querySelector('[name="methodName"]');
      const moneyRow = document.getElementById("moneyRow");
      const unitRow = document.getElementById("unitRow");

      // 銀行選択時の支店読み込み
      bankSelect.addEventListener("change", function () {
        const selectedBank = this.value;
        branchSelect.innerHTML = '<option value="">-- 読み込み中 --</option>';

        if (selectedBank) {
          fetch(`/getBranches?bankName=${encodeURIComponent(selectedBank)}`)
            .then(response => response.json())
            .then(branches => {
              branchSelect.innerHTML = '';
              if (branches.length > 0) {
                branches.forEach(branch => {
                  const option = document.createElement("option");
                  option.value = branch;
                  option.text = branch;
                  branchSelect.appendChild(option);
                });
              } else {
                branchSelect.innerHTML = '<option value="">支店が見つかりません</option>';
              }
            })
            .catch(error => {
              console.error('支店の取得に失敗しました', error);
              branchSelect.innerHTML = '<option value="">エラーが発生しました</option>';
            });
        } else {
          branchSelect.innerHTML = '<option value="">-- 銀行を選択してください --</option>';
        }
      });

      // 購入方法の選択に応じて入力欄を切り替え
      methodSelect.addEventListener("change", function () {
        const selected = this.value;
        if (selected === "金額指定") {
          moneyRow.style.display = "flex";
          unitRow.style.display = "none";
        } else if (selected === "口数指定") {
          moneyRow.style.display = "none";
          unitRow.style.display = "flex";
        } else {
          moneyRow.style.display = "none";
          unitRow.style.display = "none";
        }
      });

      // フォームリセット時の支店初期化
      form.addEventListener("reset", function () {
        branchSelect.innerHTML = '<option value="">-- 銀行を選択してください --</option>';
        moneyRow.style.display = "flex";
        unitRow.style.display = "none";
      });

      // バリデーション処理
      form.addEventListener("submit", function (e) {
        let isValid = true;

        const bankName = document.getElementById("bankSelect").value;
        const branchName = document.getElementById("branchSelect").value;
        const accountType = document.querySelector('[name="bankAccountType"]').value;
        const accountNum = document.querySelector('[name="bankAccountNum"]').value;
        const name = document.querySelector('[name="name"]').value;
        const fundName = document.querySelector('[name="fundName"]').value;
        const methodName = document.querySelector('[name="methodName"]').value;
        const money = document.querySelector('[name="money"]').value;
        const unit = document.querySelector('[name="unit"]').value;

        const warnings = {
          bank: document.getElementById("bankWarning"),
          branch: document.getElementById("branchWarning"),
          type: document.getElementById("typeWarning"),
          account: document.getElementById("accountWarning"),
          name: document.getElementById("nameWarning"),
          fund: document.getElementById("fundWarning"),
          methodName: document.getElementById("methodWarning"),
          money: document.getElementById("moneyWarning"),
          unit: document.getElementById("unitWarning")
        };

        // 共通項目のバリデーション
        if (bankName === "") { warnings.bank.style.display = "inline"; isValid = false; } else { warnings.bank.style.display = "none"; }
        if (branchName === "") { warnings.branch.style.display = "inline"; isValid = false; } else { warnings.branch.style.display = "none"; }
        if (accountType === "") { warnings.type.style.display = "inline"; isValid = false; } else { warnings.type.style.display = "none"; }
        if (accountNum === "" || accountNum.length < 6 || accountNum.length > 8) { warnings.account.style.display = "inline"; isValid = false; } else { warnings.account.style.display = "none"; }
        if (name === "") { warnings.name.style.display = "inline"; isValid = false; } else { warnings.name.style.display = "none"; }
        if (fundName === "") { warnings.fund.style.display = "inline"; isValid = false; } else { warnings.fund.style.display = "none"; }
        if (methodName === "") { warnings.methodName.style.display = "inline"; isValid = false; } else { warnings.methodName.style.display = "none"; }

        // 購入方法に応じたバリデーション
        if (methodName === "金額指定") {
          if (money === "") {
            warnings.money.style.display = "inline";
            isValid = false;
          } else {
            warnings.money.style.display = "none";
          }
          warnings.unit.style.display = "none";
        } else if (methodName === "口数指定") {
          if (unit === "") {
            warnings.unit.style.display = "inline";
            isValid = false;
          } else {
            warnings.unit.style.display = "none";
          }
          warnings.money.style.display = "none";
        }

        if (!isValid) {
          e.preventDefault();
        }
      });
    });
</script>






</body>

</html>
