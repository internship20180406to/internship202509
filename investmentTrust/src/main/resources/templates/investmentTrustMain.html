<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>投資信託注文情報入力画面</title>
    <style>
        html {
          height:100%;
        }

        body {
          margin:0;
        }

        .bg {
          animation:slide 3s ease-in-out infinite alternate;
          background-image: linear-gradient(-60deg, #6c3 50%, #09f 50%);
          bottom:0;
          left:-50%;
          opacity:.5;
          position:fixed;
          right:-50%;
          top:0;
          z-index:-1;
        }

        .bg2 {
          animation-direction:alternate-reverse;
          animation-duration:4s;
        }

        .bg3 {
          animation-duration:5s;
        }

        .content {
          background-color:rgba(255,255,255,.8);
          border-radius:.25em;
          box-shadow:0 0 .25em rgba(0,0,0,.25);
          box-sizing:border-box;
          left:50%;
          padding:10vmin;
          position:fixed;
          text-align:center;
          top:50%;
          transform:translate(-50%, -50%);
        }

        h1 {
          font-family:monospace;
        }

        @keyframes slide {
          0% {
            transform:translateX(-25%);
          }
          100% {
            transform:translateX(25%);
          }
        }

        body {
        background-color: #4169E1;
        margin: 0;
        padding: 0;
        display: flex;
        padding-top: 40px;
        padding-bottom: 40px;
        justify-content: center;
        align-items: center;
        min-height: 85vh;
        overflow: auto;
        }
        .content {
         font-size: 22px;
         background-color: #ffffff;
         width: 600px;
         padding: 40px;
         padding-top: 0px;
         padding-bottom: 0px;
         border-radius: 10px;
         box-shadow: 0 4px 8px rgba(0,0,0,0.1);
         height: 850px;
         overflow: auto;

        }
        .form-control {
            width: 100%;
            padding: 8px;
            margin: 5px 0;
            box-sizing: border-box;
            font-size: 20px;

        }
        .text-danger {
        color: blue;
        }
        .form-control-button {
        width: 120px;
        padding: 10px 20px;
        margin-top: 10px;
        border: none;
        cursor: pointer;
        border-radius: 5px;
        }
        .form-confirmation-button{
        color: white;
        background-color: #2185D0;
        }
        .form-confirmation-button:hover {
        background-color: #1678c2;
        }
        .form-clear-button{
        color: black;
        background-color: #E0E1E2;
        }
        .form-clear-button:hover {
        background-color: #CCCCCC;
        }

        h1 {
            font-size: 33px;
            position: relative;
            padding: 0.1em 0.5em;
            text-align: center;
            background: -webkit-linear-gradient(to top, rgb(137, 184, 255), #c5ceff);
            background: linear-gradient(to top, rgb(137, 184, 255), #c5ceff);
            color: #495193;
            margin-bottom: 0;
        }

        .form-row {
          font-size: 20px;
          width: 600px;
          display: flex;
          align-items: center;
          margin: 0 auto;
          margin-bottom: 14px;
        }

        .form-row label {
          min-width: 200px; /* ラベルの幅を固定 */
          white-space: nowrap;
        }

        .form-row select {
          flex: 1; /* セレクトボックスを残りの幅に広げる */
        }

        h2 {
          position: relative;
          padding: 0.25em 0;
          font-size: 25px;
          margin-top: 0px;

        }
        h2:after {
          content: "";
          display: block;
          height: 5px;
          background: -webkit-linear-gradient(to right, #3a86ff, #FFFFFF);
          background: linear-gradient(to right, #3a86ff, #FFFFFF);

        }

        .h3-row {
          display: flex;
          justify-content: center; /* 横方向の中央揃え */
          gap: 20px;               /* 要素間のスペース */
          margin-top: 0px;
          margin-bottom: 0;
        }

        .h3-row h3 {
          font-size: 18px;
          text-align: center;
          padding: 0.1em 0.5em;
          border-radius: 8px;
          flex: 1; /* 均等に広げたい場合は追加 */
        }

        .item-blue {
          background: linear-gradient(to right, #c5ceff, #89b8ff);
          color: #1e3c72;
        }

        .item-gray {
          background: linear-gradient(to right, #f5f5f5, #dcdcdc);
          color: #333;
        }




    </style>
</head>
<body>

<div class="bg"></div>
<div class="bg bg2"></div>
<div class="bg bg3"></div>

<div class="content">
    <h1>投資信託</h1>
    <div class="h3-row">
        <h3 class="item-blue">注文入力</h3>
        <h3 class="item-gray">注文確認</h3>
        <h3 class="item-gray">注文完了</h3>
    </div>

    <form action="#" th:action="@{/investmentTrustConfirmation}" th:object="${investmentTrustApplication}" method="post">
        <h2>口座情報</h2>
        <div class="form-row">
            <label class="ml-1">金融機関名: <small class="text-danger ml-1">※</small></label><br>
            <select th:field="*{bankName}" class="form-control" id="bankSelect">
                <option value="">-- 選択してください --</option>
                <option th:each="option : ${nameOptions}"
                        th:value="${option}"
                        th:text="${option}">選択肢</option>
            </select>
        </div>



        <div class="form-row">
            <label class="ml-1">支店名: <small class="text-danger ml-1">※</small></label><br>
            <select th:field="*{branchName}" class="form-control" id="branchSelect">
                <option value="">-- 銀行を選択してください --</option>
            </select>
        </div>



        <div class="form-row">
            <label class="ml-1">科目名: <small class="text-danger ml-1">※</small></label><br>
            <select th:field="*{bankAccountType}" class="form-control">
                <option value="">-- 選択してください --</option>
                <option value="普通">普通</option>
                <option value="当座">当座</option>
                <option value="貯蓄">貯蓄</option>
            </select>
        </div>




        <div class="form-row">
            <label class="ml-1">口座番号: <small class="text-danger ml-1">※</small></label><br>
            <input type="number" th:field="*{bankAccountNum}" class="form-control" placeholder="例)1234567"/></p>
        </div>


        <div class="form-row">
            <label class="ml-1">購入者名: <small class="text-danger ml-1">※</small></label><br>
            <input type="text" th:field="*{name}" class="form-control" placeholder="例)ふくふくたろう"/></p>
        </div>
        <h2>購入情報</h2>
        <div class="form-row">
            <label class="ml-1">銘柄: <small class="text-danger ml-1">※</small></label><br>
            <select th:field="*{fundName}" class="form-control">
                <option value="">-- 選択してください --</option>
                <option value="鯨・グローバル・インデックス">鯨・グローバル・インデックス</option>
                <option value="イカロジック・テックセレクト">イカロジック・テックセレクト</option>
                <option value="亀・ロングライフ・バランス">亀・ロングライフ・バランス</option>
                <option value="フクロウ・インサイト・ファンド">フクロウ・インサイト・ファンド</option>
                <option value="熊・ディフェンシブ・バリュー">熊・ディフェンシブ・バリュー</option>
                <option value="モグラ・アンダーグラウンド・ストラテジー">モグラ・アンダーグラウンド・ストラテジー</option>

            </select>
        </div>



        <div class="form-row">
            <label class="ml-1">購入金額 : <small class="text-danger ml-1">※</small></label><br>
            <input type="number" th:field="*{money}" class="form-control" placeholder="例)1234567"/>
        </div>

        <p style="text-align: center;"><input type="submit" value="確認"
                                              class="form-control-button form-confirmation-button"/>
            <input type="reset" value="クリア" class="form-control-button form-clear-button"/></p>

    </form>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        const bankSelect = document.getElementById("bankSelect");
        const branchSelect = document.getElementById("branchSelect");

        bankSelect.addEventListener("change", function () {
            const selectedBank = this.value;
            branchSelect.innerHTML = '<option value="">-- 読み込み中 --</option>';

            if (selectedBank) {
                fetch(`/getBranches?bankName=${encodeURIComponent(selectedBank)}`)
                    .then(response => response.json())
                    .then(branches => {
                        branchSelect.innerHTML = '';

                        if (branches.length > 0) {
                            branches.forEach(branch => {
                                const option = document.createElement("option");
                                option.value = branch;
                                option.text = branch;
                                branchSelect.appendChild(option);
                            });
                        } else {
                            branchSelect.innerHTML = '<option value="">支店が見つかりません</option>';
                        }
                    })
                    .catch(error => {
                        console.error('支店の取得に失敗しました', error);
                        branchSelect.innerHTML = '<option value="">エラーが発生しました</option>';
                    });
            } else {
                branchSelect.innerHTML = '<option value="">-- 銀行を選択してください --</option>';
            }
        });
    });
</script>

</body>

</html>
