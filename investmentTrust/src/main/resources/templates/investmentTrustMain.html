<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>投資信託注文情報入力画面</title>
    <style>
        body {
        background-color: #4169E1;
        margin: 0;
        padding: 0;
        display: flex;
        padding-top: 40px;
        padding-bottom: 40px;
        justify-content: center;
        align-items: center;
        min-height: 85vh;
        overflow: auto;
        }
        .content {
         font-size: 22px;
         background-color: #ffffff;
         width: 600px;
         padding: 40px;
         padding-top: 0px;
         padding-bottom: 0px;
         border-radius: 10px;
         box-shadow: 0 4px 8px rgba(0,0,0,0.1);
         height: 800px;
         overflow: auto;

        }
        .form-control {
            width: 100%;
            padding: 8px;
            margin: 5px 0;
            box-sizing: border-box;
            font-size: 20px;

        }
        .text-danger {
        color: blue;
        }
        .form-control-button {
        width: 120px;
        padding: 10px 20px;
        margin-top: 10px;
        border: none;
        cursor: pointer;
        border-radius: 5px;
        }
        .form-confirmation-button{
        color: white;
        background-color: #2185D0;
        }
        .form-confirmation-button:hover {
        background-color: #1678c2;
        }
        .form-clear-button{
        color: black;
        background-color: #E0E1E2;
        }
        .form-clear-button:hover {
        background-color: #CCCCCC;
        }

        h1 {
            font-size: 33px;
            position: relative;
            padding: 0.1em 0.5em;
            text-align: center;
            background: -webkit-linear-gradient(to top, rgb(137, 184, 255), #c5ceff);
            background: linear-gradient(to top, rgb(137, 184, 255), #c5ceff);
            color: #495193;
        }

        .form-row {
          font-size: 20px;
          width: 600px;
          display: flex;
          align-items: center;
          margin: 0 auto;
          margin-bottom: 14px;
        }

        .form-row label {
          min-width: 200px; /* ラベルの幅を固定 */
          white-space: nowrap;
        }

        .form-row select {
          flex: 1; /* セレクトボックスを残りの幅に広げる */
        }

        h2 {
          position: relative;
          padding: 0.25em 0;
          font-size: 25px;

        }
        h2:after {
          content: "";
          display: block;
          height: 5px;
          background: -webkit-linear-gradient(to right, #3a86ff, #FFFFFF);
          background: linear-gradient(to right, #3a86ff, #FFFFFF);

        }


    </style>
</head>
<body>
<div class="content">
    <h1>投資信託注文情報入力</h1>
    <form action="#" th:action="@{/investmentTrustConfirmation}" th:object="${investmentTrustApplication}" method="post">
        <h2>口座情報</h2>
        <div class="form-row">
            <label class="ml-1">金融機関名: <small class="text-danger ml-1">※</small></label><br>
            <select th:field="*{bankName}" class="form-control" id="bankSelect">
                <option value="">-- 選択してください --</option>
                <option th:each="option : ${nameOptions}"
                        th:value="${option}"
                        th:text="${option}">選択肢</option>
            </select>
        </div>



        <div class="form-row">
            <label class="ml-1">支店名: <small class="text-danger ml-1">※</small></label><br>
            <select th:field="*{branchName}" class="form-control" id="branchSelect">
                <option value="">-- 銀行を選択してください --</option>
            </select>
        </div>



        <div class="form-row">
            <label class="ml-1">科目名: <small class="text-danger ml-1">※</small></label><br>
            <select th:field="*{bankAccountType}" class="form-control">
                <option value="">-- 選択してください --</option>
                <option value="普通">普通</option>
                <option value="当座">当座</option>
                <option value="貯蓄">貯蓄</option>
            </select>
        </div>




        <div class="form-row">
            <label class="ml-1">口座番号: <small class="text-danger ml-1">※</small></label><br>
            <input type="number" th:field="*{bankAccountNum}" class="form-control" placeholder="1234567"/></p>
        </div>


        <div class="form-row">
            <label class="ml-1">購入者名: <small class="text-danger ml-1">※</small></label><br>
            <input type="text" th:field="*{name}" class="form-control" placeholder="ふくふくたろう"/></p>
        </div>
        <h2>購入情報</h2>
        <div class="form-row">
            <label class="ml-1">銘柄: <small class="text-danger ml-1">※</small></label><br>
            <select th:field="*{fundName}" class="form-control">
                <option value="">-- 選択してください --</option>
                <option value="カモメ商会">カモメ商会</option>
                <option value="クジラソリューションズ">クジラソリューションズ</option>
                <option value="イソギンラボ">イソギンラボ</option>
                <option value="ブーブー製鉄所">ブーブー製鉄所</option>
                <option value="ヤマネコデザイン株式会社">ヤマネコデザイン株式会社</option>
                <option value="鹿野ワークス">鹿野ワークス</option>

            </select>
        </div>



        <div class="form-row">
            <label class="ml-1">購入金額 : <small class="text-danger ml-1">※</small></label><br>
            <input type="number" th:field="*{money}" class="form-control" placeholder="1234567"/>
        </div>

        <p style="text-align: center;"><input type="submit" value="確認"
                                              class="form-control-button form-confirmation-button"/>
            <input type="reset" value="クリア" class="form-control-button form-clear-button"/></p>

    </form>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        const bankSelect = document.getElementById("bankSelect");
        const branchSelect = document.getElementById("branchSelect");

        bankSelect.addEventListener("change", function () {
            const selectedBank = this.value;
            branchSelect.innerHTML = '<option value="">-- 読み込み中 --</option>';

            if (selectedBank) {
                fetch(`/getBranches?bankName=${encodeURIComponent(selectedBank)}`)
                    .then(response => response.json())
                    .then(branches => {
                        branchSelect.innerHTML = '';

                        if (branches.length > 0) {
                            branches.forEach(branch => {
                                const option = document.createElement("option");
                                option.value = branch;
                                option.text = branch;
                                branchSelect.appendChild(option);
                            });
                        } else {
                            branchSelect.innerHTML = '<option value="">支店が見つかりません</option>';
                        }
                    })
                    .catch(error => {
                        console.error('支店の取得に失敗しました', error);
                        branchSelect.innerHTML = '<option value="">エラーが発生しました</option>';
                    });
            } else {
                branchSelect.innerHTML = '<option value="">-- 銀行を選択してください --</option>';
            }
        });
    });
</script>

</body>

</html>
