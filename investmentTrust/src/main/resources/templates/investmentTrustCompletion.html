<!doctype html>
<html>
<head>
    <meta charset="UTF-8"/>
    <title>注文完了画面</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #f9f9f9;
            padding: 0;
            margin: 0;
            text-align: center;
        }

        h1 {
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 30px;
            background: linear-gradient(45deg,#75c7f0,#fafafa)!important;
            padding: 10px 0;
        }

        .complete-box {
            background-color: #fff;
            border: 1px solid #d7d7d7;
            border-radius: 6px;
            padding: 30px;
            width: 460px;
            margin: 0 auto;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
            font-size: 16px;
        }

        .btn {
            display: inline-block;
            width: 100px;
            line-height: 30px;
            font-size: 12px;
            margin: 10px;
            cursor: pointer;
            border-radius: 4px;
            border: 1px solid;
            position: relative;
            z-index: 1;
            padding: 4px 8px;
            transition: color 0.3s ease;
        }

        .btn::before {
            z-index: -1;
            position: absolute;
            top: 0;
            left: 0;
            content: "";
            display: block;
            width: 100%;
            height: 100%;
            transform: scaleX(0);
            transform-origin: right;
            transition: transform 0.5s ease;
        }

        .btn:hover::before {
            transform: scaleX(1);
            transform-origin: left;
        }

        .btn-back {
            border-color: #ccc;
            color: #333;
        }

        .btn-back::before {
            background-color: #e0e0e0;
        }

        .btn-back:hover {
            color: #000;
        }
    </style>
</head>
<body>
<h1>注文完了</h1>
<div class="complete-box">
    ご注文ありがとうございました。<br>
    内容を確認のうえ、処理を進めさせていただきます。
    <div>
        <button type="button" class="btn btn-back" onclick="window.location='/investmentTrust';">注文に戻る</button>
    </div>
</div>
</body>
</html>
