<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>注文完了画面</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #f9f9f9;
            padding: 0;
            margin: 0;
            text-align: center;
        }

<!--        h1 {-->
<!--            margin-top: 0;-->
<!--            margin-bottom: 20px;-->
<!--            font-size: 30px;-->
<!--            background: linear-gradient(45deg,#75c7f0,#fafafa)!important;-->
<!--            padding: 10px 0;-->
<!--        }-->

        .complete-box {
            background-color: #fff;
            border: 1px solid #d7d7d7;
            border-radius: 6px;
            padding: 30px;
            width: 460px;
            margin: 0 auto;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
            font-size: 16px;
        }

        .btn {
            display: inline-block;
            width: 100px;
            line-height: 30px;
            font-size: 12px;
            margin: 10px;
            cursor: pointer;
            border-radius: 4px;
            border: 1px solid;
            position: relative;
            z-index: 1;
            padding: 4px 8px;
            transition: color 0.3s ease;
        }

        .btn::before {
            z-index: -1;
            position: absolute;
            top: 0;
            left: 0;
            content: "";
            display: block;
            width: 100%;
            height: 100%;
            transform: scaleX(0);
            transform-origin: right;
            transition: transform 0.5s ease;
        }

        .btn:hover::before {
            transform: scaleX(1);
            transform-origin: left;
        }

        .btn-back {
            border-color: #ccc;
            color: #333;
        }

        .btn-back::before {
            background-color: #e0e0e0;
        }

        .btn-back:hover {
            color: #000;
        }

<!--        .step {-->
<!--  background-color: #e0e0e0;-->
<!--  color: #333;-->
<!--}-->

.step.is-complete {
  background-color: #1B85FB;
  color: #fff;
}

.step.is-complete::after {
  border-left-color: #1B85FB;
}

.app-header {
margin-bottom: 20px;
  display: flex;
  justify-content: space-between; /* 左右に分ける */
  align-items: center;
  padding: 10px 20px;
  background: linear-gradient(45deg, #75c7f0, #fafafa)!important;
}


.app-header h1 {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  margin: 0;
  font-size: 24px;
  background: none; /* ← これが重要！ */
  padding: 0;
  z-index: 1;
}

.progress-bar {
  display: flex;
  gap: 4px;
  white-space: nowrap;
  background: none;
  margin-left: auto;
}


.step {
  position: relative;
  padding: 6px 16px;
  background-color: #e0e0e0;
  color: #333;
  clip-path: polygon(0 0, 90% 0, 100% 50%, 90% 100%, 0 100%);
  font-size: 12px;
}

.step.is-complete {
  background-color: #1B85FB;
  color: #fff;
}

    </style>
</head>
<body>
<div class="app-header">
    <h1>注文完了</h1>
    <div class="progress-bar">
        <div class="step" th:classappend="${currentStep >= 1} ? 'is-complete'">入力</div>
        <div class="step" th:classappend="${currentStep >= 2} ? 'is-complete'">確認</div>
        <div class="step" th:classappend="${currentStep == 3} ? 'is-complete'">完了</div>
    </div>
</div>

<div class="complete-box">
    ご注文ありがとうございました。<br>
    内容を確認のうえ、処理を進めさせていただきます。
    <div>
        <button type="button" class="btn btn-back" onclick="window.location='/investmentTrust';">注文に戻る</button>
    </div>
</div>
</body>
</html>
