    .confirm-table {
    width: 460px;
    margin: 0 auto 10px;
    border-collapse: collapse;
    background-color: #fff;
    border: 1px solid #d7d7d7;
    }

    .confirm-table th,
    .confirm-table td {
    padding: 10px 15px;
    text-align: left;
    border-bottom: 1px solid #eee;
    font-size: 14px;
    }

    .button-group {
    margin-top: 10px;
    }

    .btn {
    display: inline-block;
    width: 100px;
    line-height: 30px;
    font-size: 12px;
    margin: 5px;
    cursor: pointer;
    border-radius: 4px;
    border: 1px solid;
    position: relative;
    z-index: 1;
    padding: 4px 8px;
    transition: color 0.3s ease;
    }

    .btn::before {
    z-index: -1;
    position: absolute;
    top: 0;
    left: 0;
    content: "";
    display: block;
    width: 100%;
    height: 100%;
    transform: scaleX(0);
    transform-origin: right;
    transition: transform 0.5s ease;
    }

    .btn:hover::before {
    transform: scaleX(1);
    transform-origin: left;
    }

    .btn-confirm {
    border-color: #1B85FB;
    color: #1B85FB;
    }

    .btn-confirm::before {
    background-color: #1B85FB;
    }

    .btn-confirm:hover {
    color: #fff;
    }

    .btn-clear {
    border-color: #ccc;
    color: #333;
    }

    .btn-clear::before {
    background-color: #e0e0e0;
    }

    .btn-clear:hover {
    color: #000;
    }

.step.is-complete {
  background-color: #1B85FB;
  color: #fff;
}

.step.is-complete::after {
  border-left-color: #1B85FB;
}

.app-header {
margin-bottom: 20px;
  display: flex;
  justify-content: space-between; /* 左右に分ける */
  align-items: center;
  padding: 10px 20px;
  background: linear-gradient(45deg, #75c7f0, #fafafa)!important;
}


.app-header h1 {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  margin: 0;
  font-size: 24px;
  background: none; /* ← これが重要！ */
  padding: 0;
  z-index: 1;
}

.progress-bar {
  display: flex;
  gap: 4px;
  white-space: nowrap;
  background: none;
  margin-left: auto;
}


.step {
  position: relative;
  padding: 6px 16px;
  background-color: #e0e0e0;
  color: #333;
  clip-path: polygon(0 0, 90% 0, 100% 50%, 90% 100%, 0 100%);
  font-size: 12px;
}

.step.is-complete {
  background-color: #1B85FB;
  color: #fff;
}
</style>

<div class="app-header">
    <h1 style="text-align: center">投資信託注文確認画面</h1>
    <div class="progress-bar">
        <div class="step" th:classappend="${currentStep >= 1} ? 'is-complete'">入力</div>
        <div class="step" th:classappend="${currentStep >= 2} ? 'is-complete'">確認</div>
        <div class="step" th:classappend="${currentStep == 3} ? 'is-complete'">完了</div>
    </div>
</div>
<form th:action="@{/investmentTrustCompletion}" th:object="${investmentTrustApplication}" method="post">
    <table class="confirm-table">
        <tr><th>金融機関名</th><td th:text="*{bankName}"></td></tr>
        <tr><th>支店名</th><td th:text="*{ShopName}"></td></tr>
        <tr><th>科目名</th><td th:text="*{Subject}"></td></tr>
        <tr><th>口座番号</th><td th:text="*{bankAccountNum}"></td></tr>
        <tr><th>購入者</th><td th:text="*{Purchaser}"></td></tr>
        <tr><th>銘柄名</th><td th:text="*{BrandName}"></td></tr>
        <tr><th>購入金額</th><td th:text="*{amount} + '円'"></td></tr>
    </table>

    <!-- hidden inputs -->
    <input type="hidden" th:field="*{bankAccountNum}"/>
    <input type="hidden" th:field="*{Subject}"/>
    <input type="hidden" th:field="*{ShopName}"/>
    <input type="hidden" th:field="*{bankName}"/>
    <input type="hidden" th:field="*{Purchaser}"/>
    <input type="hidden" th:field="*{BrandName}"/>
    <input type="hidden" th:field="*{amount}"/>

    <div class="button-group">
        <button type="submit" class="btn btn-confirm">申込</button>
        <button type="button" class="btn btn-clear" onclick="window.location='/investmentTrust';">キャンセル</button>
<!--        <form th:action="@{/investmentTrustBack}" method="post">-->
<!--            <button type="submit" class="btn btn-clear">キャンセル</button>-->
    </div>
</form>
